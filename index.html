<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>課題研究 ゲイン操作</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="favicon.ico" type="image/x-icon">
</head>

<body>

  <header>
    <div class="logo">課題研究</div>
    <div class="subtitle">Web Bluetoothによるゲイン制御</div>
  </header>

  <main class="container">
    <h1>プリアンプの操作</h1>

    <button id="connectBtn">Arduino に接続</button>

    <div class="control">
      <label for="slider">ポテンショメータ値</label>
      <input type="range" id="slider" min="0" max="255" value="0">
      <div class="value">
        現在値：<span id="valueLabel">0</span>
      </div>
    </div>

    <div class="log" id="log"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
